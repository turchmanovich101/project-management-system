# Конфігураційний файл для pytest - налаштування тестування

[pytest]
# testpaths - вказує pytest де шукати тести
# pytest буде шукати файли з тестами тільки в директорії tests/
testpaths = tests

# python_files - шаблон імен файлів з тестами
# pytest буде запускати тільки файли, які починаються з test_
python_files = test_*.py

# python_classes - шаблон імен класів з тестами
# pytest буде запускати тільки класи, які починаються з Test
python_classes = Test*

# python_functions - шаблон імен функцій-тестів
# pytest буде запускати тільки функції, які починаються з test_
python_functions = test_*

# addopts - додаткові опції для pytest
# -v: verbose mode - детальний вивід (показує кожен тест окремо)
# -s: показувати print() в консолі під час виконання тестів
# --cov=project_manager: вимірювати покриття коду в пакеті project_manager
# --cov-report=term-missing: показувати які рядки коду не покриті тестами
addopts = -v -s --cov=project_manager --cov-report=term-missing
