# Конфігураційний файл для tox - автоматизація тестування в різних середовищах

[tox]
# envlist - список тестових середовищ для запуску
# py38, py39, py310, py311 - тестування на різних версіях Python
envlist = py38,py39,py310,py311

# skipsdist - пропустити створення distribution пакета
# True = швидше тестування для розробки
skipsdist = True

[testenv]
# Налаштування тестового середовища

# deps - залежності, які потрібно встановити в тестовому середовищі
deps =
    pytest>=7.0.0       # Фреймворк для тестування
    pytest-cov>=4.0.0   # Плагін для покриття коду

# commands - команди для запуску в тестовому середовищі
# pytest tests/ - запустити всі тести в директорії tests/
commands =
    pytest tests/

# setenv - встановлення змінних середовища
# PYTHONPATH=src - додаємо src до шляху пошуку модулів Python
setenv =
    PYTHONPATH = src
